[package]
name = "sign-bridge"
version = "1.0.0"
description = "Sign Bridge desktop shell"
authors = ["Sign Bridge Team"]
edition = "2021"

[lib]
name = "sign_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
